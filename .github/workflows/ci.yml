name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # Non-blocking for now: the app has a pre-existing lint backlog (~26
      # errors, mostly react-hooks/set-state-in-effect) that predates CI and
      # needs its own reviewed cleanup pass rather than a blind blanket fix.
      # Flip this to blocking once that backlog is cleared.
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
        env:
          # /coach prerenders at build time and needs a real Supabase client
          # to do it — Vercel and local .env.local already have these; CI
          # never did, which is why `npm run build` failed here specifically
          # and nowhere else.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
